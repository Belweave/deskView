name: Package app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  development-package:
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1_Release_Candidate.app/Contents/Developer
      DESKVIEW_JOBS: 2
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/test.sh
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - run: ./scripts/build.sh Release
      - name: Create development ZIP
        run: |
          mkdir -p output
          ditto -c -k --sequesterRsrc --keepParent '.build/xcode/Build/Products/Release/deskView().app' output/deskView-arm64-development.zip
      - uses: actions/upload-artifact@v4
        with:
          name: deskView-arm64-development
          path: output/deskView-arm64-development.zip
      - name: Retain build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: .build/logs/
          if-no-files-found: ignore
