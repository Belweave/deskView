name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1_Release_Candidate.app/Contents/Developer
      DESKVIEW_JOBS: 2
    steps:
      - uses: actions/checkout@v5
      - name: Verify Xcode
        run: ./scripts/check-toolchain.sh
      - name: Test composition and recording
        run: ./scripts/test.sh
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build the native app
        run: ./scripts/build.sh Debug
      - name: Retain build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: .build/logs/
          if-no-files-found: ignore
